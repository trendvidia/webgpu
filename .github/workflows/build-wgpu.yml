name: Build wgpu-native

on:
  workflow_dispatch:

env:
  ANDROID_MIN_SDK: "21"
  # wgpu-native tag the whole vendored set (and wgpu/lib/webgpu.h) is built from.
  # Pinned (was an unpinned HEAD clone) so a full-set regen reproduces the checked-in
  # header's ABI instead of silently jumping to a newer wgpu API. Bump this — and
  # re-vendor wgpu/lib/webgpu.h — to intentionally upgrade wgpu-native (trendvidia/fyne#609).
  WGPU_NATIVE_REF: "v22.1.0.5"

jobs:
  build-wgpu:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build - linux/amd64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64

          - name: build - windows/amd64
            os: windows-2022
            target: x86_64-pc-windows-gnu
            goos: windows
            goarch: amd64
            setup_env: |
              choco install -y --force llvm | exit 0
              echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $GITHUB_ENV

          - name: build - windows/arm64
            os: windows-2022
            # GNU (gnullvm) ABI, not MSVC: upstream wgpu-native ships only an
            # aarch64-pc-windows-msvc lib, whose SEH/vcruntime C++ EH cannot be
            # linked by the llvm-mingw toolchain Go/cgo uses on windows/arm64.
            # gnullvm produces Itanium-ABI objects that link, exactly like the
            # amd64 -gnu target. Cross-compiled from the x64 windows-2022 runner:
            # the crate is a staticlib (object archive, no final link), so only
            # bindgen needs the aarch64 headers — supplied via llvm-mingw below.
            # See wgpu/lib/windows/arm64/BUILD.md and trendvidia/fyne#609/#612.
            target: aarch64-pc-windows-gnullvm
            goos: windows
            goarch: arm64
            setup_env: |
              set -ex
              # libclang for bindgen. The x64 host clang is fine — we only re-point
              # the *parse* target at aarch64 via BINDGEN_EXTRA_CLANG_ARGS below.
              choco install -y --force llvm | exit 0
              echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $GITHUB_ENV

              # llvm-mingw supplies the aarch64-w64-mingw32 sysroot bindgen parses
              # against. Parse in GNU mode (--target=aarch64-w64-mingw32): mingw's
              # vadefs.h only has an MSVC-macro branch for ARM64, so an MSVC-target
              # parse yields opaque structs.
              LLVM_MINGW=llvm-mingw-20250430-ucrt-x86_64
              curl -sSL -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20250430/$LLVM_MINGW.zip
              7z x llvm-mingw.zip -oC:/ >/dev/null
              SYSROOT="C:/$LLVM_MINGW/aarch64-w64-mingw32"
              echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_pc_windows_gnullvm=--target=aarch64-w64-mingw32 --sysroot=$SYSROOT" >> $GITHUB_ENV

          - name: build - darwin/amd64
            os: macos-13
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64

          - name: build - darwin/arm64
            os: macos-14
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64

          - name: build - ios/amd64
            os: macos-13
            target: x86_64-apple-ios
            goos: ios
            goarch: amd64

          - name: build - ios/arm64
            os: macos-14
            target: aarch64-apple-ios
            goos: ios
            goarch: arm64

          - name: build - android/amd64
            os: ubuntu-22.04
            target: x86_64-linux-android
            goos: android
            goarch: amd64
            setup_env: |
              set -x
              export CC=$ANDROID_NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android$ANDROID_MIN_SDK-clang

              echo "CC=$CC" >> $GITHUB_ENV
              echo "CXX=$CC++" >> $GITHUB_ENV
              echo "CLANG_PATH=$CC" >> $GITHUB_ENV
              echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$CC" >> $GITHUB_ENV

          - name: build - android/386
            os: ubuntu-22.04
            target: i686-linux-android
            goos: android
            goarch: '386'
            setup_env: |
              set -x
              export CC=$ANDROID_NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android$ANDROID_MIN_SDK-clang

              echo "CC=$CC" >> $GITHUB_ENV
              echo "CXX=$CC++" >> $GITHUB_ENV
              echo "CLANG_PATH=$CC" >> $GITHUB_ENV
              echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$CC" >> $GITHUB_ENV

          - name: build - android/arm64
            os: ubuntu-22.04
            target: aarch64-linux-android
            goos: android
            goarch: arm64
            setup_env: |
              set -x
              export CC=$ANDROID_NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android$ANDROID_MIN_SDK-clang

              echo "CC=$CC" >> $GITHUB_ENV
              echo "CXX=$CC++" >> $GITHUB_ENV
              echo "CLANG_PATH=$CC" >> $GITHUB_ENV
              echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CC" >> $GITHUB_ENV

          - name: build - android/arm
            os: ubuntu-22.04
            target: armv7-linux-androideabi
            goos: android
            goarch: arm
            setup_env: |
              set -x
              export CC=$ANDROID_NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi$ANDROID_MIN_SDK-clang

              echo "CC=$CC" >> $GITHUB_ENV
              echo "CXX=$CC++" >> $GITHUB_ENV
              echo "CLANG_PATH=$CC" >> $GITHUB_ENV
              echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$CC" >> $GITHUB_ENV

    steps:
      # Checkout
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - if: ${{ matrix.goos == 'android' }}
        name: Setup Android NDK
        shell: bash
        run: |
          set -ex
          mkdir -p /tmp/go-webgpu-ndk/
          cd /tmp/go-webgpu-ndk/

          # ndkVersion "25.2.9519653"
          curl -LO https://dl.google.com/android/repository/android-ndk-r25c-linux.zip

          unzip android-ndk-r25c-linux.zip
          rm android-ndk-r25c-linux.zip
          export ANDROID_NDK_PATH=$PWD/android-ndk-r25c

          echo "ANDROID_NDK_PATH=$ANDROID_NDK_PATH" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=$ANDROID_NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/lib64/libclang.so.13" >> $GITHUB_ENV
          echo "LLVM_CONFIG_PATH=$ANDROID_NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-config" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS='-isysroot $ANDROID_NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot'" >> $GITHUB_ENV

      - name: Setup Environment
        shell: bash
        run: ${{ matrix.setup_env }}

      - name: Build
        shell: bash
        run: |
          set -ex

          git clone --recursive --branch "$WGPU_NATIVE_REF" --depth 1 https://github.com/gfx-rs/wgpu-native.git tmp
          cd tmp

          # workaround missing libgcc in ndk r23+
          if [ ${{ matrix.goos }} == "android" ]; then
            mkdir -p tmp-lib
            echo "INPUT(-lunwind)" | tee tmp-lib/libgcc.a
            export RUSTFLAGS="-L $PWD/tmp-lib"
          fi

          # windows/arm64: bump bindgen so it understands a modern libclang AST
          # (0.70 mis-traverses recent clang -> opaque structs). Build-only dep,
          # does not change the emitted FFI ABI. See wgpu/lib/windows/arm64/BUILD.md.
          if [ "${{ matrix.target }}" == "aarch64-pc-windows-gnullvm" ]; then
            sed -i -E 's/^bindgen = .*/bindgen = "0.72"/' Cargo.toml
            grep -n '^bindgen' Cargo.toml
          fi

          cargo build --release --config profile.release.strip=\"symbols\"
          ls -al target/${{ matrix.target }}/release/

          mv target/${{ matrix.target }}/release/libwgpu_native.a target/${{ matrix.target }}/release/${{ matrix.goos }}_${{ matrix.goarch }}_libwgpu_native.a

      - uses: actions/upload-artifact@v4
        with:
          name: wgpu-artifacts
          path: |
            ${{ github.workspace }}/tmp/target/${{ matrix.target }}/release/${{ matrix.goos }}_${{ matrix.goarch }}_libwgpu_native.a

  send-pr:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build-wgpu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wgpu-artifacts
          path: ${{ github.workspace }}/tmp

      - name: Copy artifacts
        shell: bash
        run: |
          set -ex

          declare -a arr=(
              "android_amd64"
              "android_386"
              "android_arm"
              "android_arm64"
              "darwin_amd64"
              "darwin_arm64"
              "ios_amd64"
              "ios_arm64"
              "linux_amd64"
              "windows_amd64"
              "windows_arm64")

          for i in "${arr[@]}"
          do
              # split string
              IFS='_' read -ra tuple <<< "$i"
              GOOS="${tuple[0]}"
              GOARCH="${tuple[1]}"

              mkdir -p $GITHUB_WORKSPACE/wgpu/lib/$GOOS/$GOARCH
              rm -f $GITHUB_WORKSPACE/wgpu/lib/$GOOS/$GOARCH/libwgpu_native.a
              cp $GITHUB_WORKSPACE/tmp/"$GOOS"_"$GOARCH"_libwgpu_native.a $GITHUB_WORKSPACE/wgpu/lib/$GOOS/$GOARCH/libwgpu_native.a
          done

          rm -rf $GITHUB_WORKSPACE/tmp
          tree $GITHUB_WORKSPACE/wgpu
